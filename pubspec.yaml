name: pyroguard_iot
description: PyroGuard IoT - Autonomous Fire Detection System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.3
  go_router: ^13.2.0
  flutter_local_notifications: ^17.1.2
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  record: ^6.1.2
  http: ^1.2.0
  url_launcher: ^6.2.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.3
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.6
  table_calendar: ^3.1.2
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: ^0.20.3
  video_player: ^2.9.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  local_auth: ^2.3.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

# image (used by the PDF package) needs a newer archive than some packages pin.
dependency_overrides:
  archive: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg
    - assets/images/phonix_logo.png
    - assets/images/logo_phoenix.png
    - assets/images/floorplan.png
    - assets/images/evacuation_plan_standard.png
    - assets/video/house_walkthrough.mp4
    - assets/video/house_walkthrough_poster.jpg
    - assets/tutorial/narration/
    - assets/tutorial/transparent/
    - assets/tutorial/transparent/benediktuspaktus/
    - assets/tutorial/transparent/danayaa/
    - assets/tutorial/transparent/debbb/
    - assets/tutorial/transparent/nowellastna/
    - assets/sounds/warning_beep.wav
    - assets/sounds/fire_alarm.wav
    - assets/sounds/safe_tone.wav
